<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Cashback Tracker</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cashback" />
<meta name="theme-color" content="#07090f" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="topbarTitle">Overview</h1>
    <div class="topbar-right">
      <button class="topbar-action" id="topbarAction" hidden>+ Add Card</button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="updateBar" class="update-bar" hidden></div>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab-btn active" data-tab="home">
      <span class="tb-ico"><svg viewBox="0 0 24 24"><path d="M3 10.6 12 3.4l9 7.2"/><path d="M5.7 9.6V20h12.6V9.6"/><path d="M9.8 20v-5.4h4.4V20"/></svg></span>
      <span class="tb-lab">Overview</span>
    </button>
    <button class="tab-btn" data-tab="log">
      <span class="tb-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 8.2v7.6M8.2 12h7.6"/></svg></span>
      <span class="tb-lab">Add</span>
    </button>
    <button class="tab-btn" data-tab="cards">
      <span class="tb-ico"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12.5" rx="2.6"/><path d="M3 10.2h18"/><path d="M16.4 14.8h2.2"/></svg></span>
      <span class="tb-lab">Cards</span>
    </button>
    <button class="tab-btn" data-tab="history">
      <span class="tb-ico"><svg viewBox="0 0 24 24"><path d="M4.5 7h15M4.5 12h15M4.5 17h9"/></svg></span>
      <span class="tb-lab">Activity</span>
    </button>
    <button class="tab-btn" data-tab="track">
      <span class="tb-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3.1 2.1"/></svg></span>
      <span class="tb-lab">Track</span>
    </button>
    <button class="tab-btn" data-tab="stats">
      <span class="tb-ico"><svg viewBox="0 0 24 24"><path d="M4.5 19.5V11M9.8 19.5V5.5M15.1 19.5v-6M20.4 19.5v-9"/></svg></span>
      <span class="tb-lab">Stats</span>
    </button>
  </nav>
</div>

<div id="sheetBackdrop" class="sheet-backdrop"></div>
<div id="sheet" class="sheet"></div>
<div id="toast" class="toast"></div>

<script src="i18n.js"></script>
<script src="mcc.js"></script>
<script src="banks.js"></script>
<script src="app.js"></script>
</body>
</html>
