<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Cashback Tracker</title>

<!-- iOS "Add to Home Screen" PWA setup -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cashback" />
<meta name="theme-color" content="#0b1220" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="topbarTitle">Dashboard</h1>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab-btn active" data-tab="dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 13h4v8H3zM10 3h4v18h-4zM17 9h4v12h-4z"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="tab-btn" data-tab="log">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      <span>Log</span>
    </button>
    <button class="tab-btn" data-tab="cards">
      <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2.4"/><rect x="2" y="9" width="20" height="3" fill="var(--bg)"/></svg>
      <span>Cards</span>
    </button>
    <button class="tab-btn" data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      <span>History</span>
    </button>
    <button class="tab-btn" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>

<div id="sheetBackdrop" class="sheet-backdrop"></div>
<div id="sheet" class="sheet"></div>
<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
